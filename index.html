<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src * 'unsafe-inline' 'unsafe-eval'; img-src * data: blob:;">
  <link rel="stylesheet" href="style.css">
  <title>Spotify Widget</title>
</head>
<body>

  <div class="disc-wrapper" id="disc-wrapper">
    <div class="disc-group" id="disc-group">

      <!-- Spinning disc — controls must NOT be inside here -->
      <div class="disc" id="disc">
        <div class="vinyl-grooves"></div>
        <div class="album-art-ring">
          <img id="album-art"
            src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAGQAAABkAQMAAABpTeRvAAAABlBMVEUAAAD///+l2Z/dAAAAAXRSTlMAQObYZgAAABxJREFUeJztwQENAAAAwqD3P20ON6AAAAAAAADg1w1vAAABa9e6YAAAAABJRU5ErkJggg=="
            alt="Album Art">
        </div>
        <div class="center-hole"></div>
      </div>

      <!-- Controls: sibling of disc, so they don't spin; clipped by disc-group -->
      <div class="controls-overlay" id="controls-overlay">
        <button class="ctrl-btn" id="prev-btn" title="Previous">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="white">
            <path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/>
          </svg>
        </button>
        <button class="ctrl-btn" id="loop-btn" title="Loop">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17 1l4 4-4 4M3 11V9a4 4 0 0 1 4-4h14M7 23l-4-4 4-4M21 13v2a4 4 0 0 1-4 4H3"/>
          </svg>
        </button>
      </div>

    </div>
  </div>

  <script>
    const { ipcRenderer } = require('electron');

    let isPlaying = false;
    let isLooping = false;
    let lastClickTime = 0;
    let dragOrigin = null;
    let hasDragged = false;

    const disc = document.getElementById('disc');
    const discGroup = document.getElementById('disc-group');
    const discWrapper = document.getElementById('disc-wrapper');
    const loopBtn = document.getElementById('loop-btn');

    function setSpinning(playing) {
      disc.classList.toggle('spinning', playing);
    }

    // --- Circle hover detection ---
    const HOVER_RADIUS = 82;
    const DISC_RADIUS = 36; // collapsed disc is 72px wide

    function isInsideDisc(e) {
      const rect = discGroup.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      const r = discWrapper.classList.contains('hovered') ? HOVER_RADIUS : DISC_RADIUS;
      return (e.clientX - cx) ** 2 + (e.clientY - cy) ** 2 <= r * r;
    }

    discWrapper.addEventListener('mousemove', (e) => {
      const inside = isInsideDisc(e);
      discWrapper.classList.toggle('hovered', inside);
      ipcRenderer.send('set-ignore-mouse', !inside);
    });
    discWrapper.addEventListener('mouseleave', () => {
      discWrapper.classList.remove('hovered');
      ipcRenderer.send('set-ignore-mouse', true);
    });

    // --- JS drag ---
    discWrapper.addEventListener('mousedown', (e) => {
      const rect = discGroup.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      const r = rect.width / 2;
      if ((e.clientX - cx) ** 2 + (e.clientY - cy) ** 2 > r * r) return;
      dragOrigin = { x: e.screenX, y: e.screenY };
      hasDragged = false;
    });
    document.addEventListener('mousemove', (e) => {
      if (!dragOrigin) return;
      const dx = e.screenX - dragOrigin.x;
      const dy = e.screenY - dragOrigin.y;
      if (!hasDragged && Math.abs(dx) + Math.abs(dy) > 4) hasDragged = true;
      if (hasDragged) { ipcRenderer.send('drag-window', { dx, dy }); dragOrigin = { x: e.screenX, y: e.screenY }; }
    });
    document.addEventListener('mouseup', () => {
      if (!hasDragged && dragOrigin) {
        const now = Date.now();
        if (now - lastClickTime < 300) {
          lastClickTime = 0;
          ipcRenderer.send('media-command', 'next');
          isPlaying = true; setSpinning(true);
        } else {
          lastClickTime = now;
          ipcRenderer.send('media-command', 'toggle');
          isPlaying = !isPlaying; setSpinning(isPlaying);
        }
      }
      dragOrigin = null; hasDragged = false;
    });

    // --- Control buttons ---
    document.getElementById('prev-btn').addEventListener('mousedown', e => e.stopPropagation());
    document.getElementById('prev-btn').addEventListener('click', e => { e.stopPropagation(); ipcRenderer.send('media-command', 'prev'); });

    loopBtn.addEventListener('mousedown', e => e.stopPropagation());
    loopBtn.addEventListener('click', e => {
      e.stopPropagation();
      isLooping = !isLooping;
      loopBtn.querySelector('svg').style.stroke = isLooping ? '#1DB954' : 'white';
      ipcRenderer.send('media-command', 'loop');
    });

    // --- Track updates ---
    ipcRenderer.on('update-track', (event, track) => {
      try {
        document.getElementById('album-art').src = track.albumArt;
        isPlaying = track.isPlaying;
        setSpinning(isPlaying);
      } catch (err) { console.error(err); }
    });
  </script>
</body>
</html>
